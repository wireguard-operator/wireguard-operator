# This rule is not used by the project wireguard-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to wireguard-operator.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: wireguard-operator
    app.kubernetes.io/managed-by: kustomize
  name: wireguardtrafficflow-viewer-role
rules:
- apiGroups:
  - wireguard-operator.io
  resources:
  - wireguardtrafficflows
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - wireguard-operator.io
  resources:
  - wireguardtrafficflows/status
  verbs:
  - get
