{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "wireguard-operator.labels" . | nindent 4 }}
  name: {{ include "wireguard-operator.fullname" . }}-manager-role
rules:
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - ""
    resources:
      - secrets
      - serviceaccounts
      - services
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterrolebindings
      - clusterroles
      - rolebindings
      - roles
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
{{- $crds := regexSplit "(?m)^---([\n]|[\r\n])*$" (.Files.Get "crd.yaml") -1 }}
{{- range $crds }}
{{- if . }}
{{- $crd := fromYaml . }}
  - apiGroups:
      - {{ $crd.spec.group }}
    resources:
      - {{ $crd.spec.names.plural }}
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - {{ $crd.spec.group }}
    resources:
      - {{ printf "%s/finalizers" $crd.spec.names.plural }}
    verbs:
      - update
  - apiGroups:
      - {{ $crd.spec.group }}
    resources:
      - {{ printf "%s/status" $crd.spec.names.plural }}
    verbs:
      - get
      - patch
      - update
{{- end }}
{{- end }}
{{- end }}
