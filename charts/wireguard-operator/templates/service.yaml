{{- if or .Values.admissionWebhooks.enabled .Values.serviceMonitor.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "wireguard-operator.fullname" . }}
  labels:
    {{- include "wireguard-operator.labels" . | nindent 4 }}
spec:
  ports:
    {{- if or .Values.admissionWebhooks.enabled }}
    - port: 9443
      protocol: TCP
      targetPort: 9443
      name: webhook
    {{- end }}
    {{- if .Values.serviceMonitor.enabled }}
    - port: 8080
      protocol: TCP
      targetPort: 8080
      name: metric
    {{- end }}
  selector:
    {{- include "wireguard-operator.selectorLabels" . | nindent 4 }}
{{- end }}
