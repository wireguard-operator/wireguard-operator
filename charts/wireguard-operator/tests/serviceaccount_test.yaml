suite: ServiceAccount configuration
templates:
  - serviceaccount.yaml
tests:
  - it: should provide a single service account by default
    asserts:
      - isKind:
          of: ServiceAccount
      - hasDocuments:
          count: 1
      - equal:
          path: automountServiceAccountToken
          value: true

  - it: should provide a way to disable service account
    set:
      serviceAccount:
        create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should support annotations without template variables
    set:
      serviceAccount:
        annotations:
          kubernetes.io/enforce-mountable-secrets: "true"
    asserts:
      - equal:
          path: metadata.annotations
          value:
            kubernetes.io/enforce-mountable-secrets: "true"

  - it: should support annotations with template variables
    set:
      global:
        gcp:
          ksa: test-ksa
          projectId: 12345678
      serviceAccount:
        annotations:
          iam.gke.io/gcp-service-account: "{{ .Values.global.gcp.ksa }}@{{ .Values.global.gcp.projectId | toYaml }}.iam.gserviceaccount.com"
          k8s.io/templated-value: '{{ include "wireguard-operator.name" . }}'
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.annotations
          value:
            iam.gke.io/gcp-service-account: test-ksa@12345678.iam.gserviceaccount.com
            k8s.io/templated-value: wireguard-operator
