suite: Crds configuration
templates:
  - crds.yaml
tests:
  - it: should render 3 rds
    asserts:
      - isKind:
          of: CustomResourceDefinition
      - hasDocuments:
          count: 3
      - equal:
          path: .metadata.name
          value: wireguardpeers.wireguard-operator.io
        documentIndex: 0
      - equal:
          path: .metadata.name
          value: wireguards.wireguard-operator.io
        documentIndex: 1
      - equal:
          path: .metadata.name
          value: wireguardtrafficflows.wireguard-operator.io
        documentIndex: 2

      - equal:
          path: metadata.annotations
          value:
            helm.sh/resource-policy: keep

  - it: should non crds present
    set:
      crd.enable: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should not keep crds
    set:
      crd.keep: false
    asserts:
      - notExists:
          path: metadata.annotations
